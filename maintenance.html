<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#191919">
  <title>Under maintenance | Elementle</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #191919; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; color: #f4f5f2; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; display: flex; flex-direction: column; }
    header { padding: 38px 24px; text-align: center; border-bottom: 1px solid #ffffff0c; }
    .wordmark { font-size: 26px; font-weight: 800; letter-spacing: .15em; }
    .wordmark span { color: #82bc79; }
    main { flex: 1; display: grid; place-items: center; padding: 50px 24px 64px; background-image: radial-gradient(#ffffff0b 1px, transparent 1px); background-size: 28px 28px; }
    .message { width: 100%; max-width: 620px; text-align: center; }
    .element { position: relative; margin: 0 auto 32px; width: 112px; height: 126px; border: 2px solid #82bc79; border-radius: 9px; background: #243321; color: #c8eac1; box-shadow: 0 0 65px #538d4e15; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .number { position: absolute; top: 9px; left: 11px; font-size: 12px; }
    .symbol { font-size: 50px; font-weight: 700; line-height: 1.1; }
    .element-name { margin-top: 7px; font-size: 11px; letter-spacing: .06em; }
    .status { display: inline-flex; align-items: center; gap: 9px; padding: 8px 13px; border: 1px solid #538d4e77; border-radius: 30px; color: #b0d5a8; background: #20301d; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #a6d39d; }
    h1 { margin: 24px 0 20px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: clamp(30px, 6vw, 48px); font-weight: 650; line-height: 1.14; letter-spacing: -.035em; text-wrap: balance; }
    p { max-width: 470px; margin: 0 auto; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 17px; line-height: 1.8; color: #babfb6; }
    .return { margin-top: 24px; color: #dfE5db; }
    footer { padding: 23px; border-top: 1px solid #ffffff0c; color: #949c8e; font-size: 11px; text-align: center; letter-spacing: .05em; }
    @media (max-width: 400px) { header { padding: 26px 16px; } main { padding: 32px 20px; } .element { margin-bottom: 24px; } p { font-size: 16px; } }
  </style>
</head>
<body>
  <header><div class="wordmark" aria-label="Elementle">ELEME<span>N</span>TLE</div></header>
  <main>
    <section class="message" aria-labelledby="maintenance-title">
      <div class="element" aria-hidden="true"><span class="number">∞</span><span class="symbol">El</span><span class="element-name">Elementle</span></div>
      <div class="status"><span class="dot" aria-hidden="true"></span>System maintenance</div>
      <h1 id="maintenance-title">The lab is under maintenance.</h1>
      <p>Elementle is temporarily unavailable while we work on the system. Games and account features are paused.</p>
      <p class="return">Please check back soon.</p>
    </section>
  </main>
  <footer>Thanks for your patience, element explorer.</footer>
</body>
</html>
