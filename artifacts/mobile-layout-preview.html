  margin: 0 6px;
  width: calc(100% - 12px);
  transition: background 0.15s ease, color 0.15s ease;
}

.autocomplete-list button:hover,
.autocomplete-list button:focus-visible,
.autocomplete-list button.ac-active {
  background: rgba(83, 141, 78, 0.2);
  color: #fff;
  outline: none;
}

.autocomplete-list button.ac-active {
  border-left: 3px solid rgb(83, 141, 78);
  padding-left: 13px;
}

.autocomplete-list button .ac-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.autocomplete-list button .ac-match {
  color: rgb(98, 165, 92);
  font-weight: 700;
}

.autocomplete-wrapper {
  display: inline-block;
  position: relative;
}

.input-clear-btn {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  min-width: 32px;
  min-height: 32px;
  display: none;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.4);
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  border-radius: 50%;
  transition: color 0.15s ease, background 0.15s ease;
  z-index: 2;
}

.input-clear-btn.visible {
  display: flex;
}

.input-clear-btn:hover {
  color: rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.1);
}

.input-clear-btn:active {
  transform: translateY(-50%) scale(0.9);
  transition-duration: 0.05s;
}

/*Display results*/
.correct-guess-container {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

.js-additional-info,
.js-share-button {
  display: flex;
}

a.additional-info,
.share-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: auto;
  line-height: normal;
  padding: 10px 18px;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.07);
  color: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  font-size: 0.95rem;
  font-family: inherit;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}

a.additional-info:hover,
.share-button:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-1px);
}

a.additional-info:active,
.share-button:active {
  transform: scale(0.95);
  transition-duration: 0.05s;
}

.guess-button:disabled {
  border-color: rgba(255, 255, 255, 0.25);
}

/*Popup*/
.popup {
  position: fixed;
  top: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(-120%);
  background: rgba(38, 38, 38, 0.95);
  color: #fff;
  padding: 16px 36px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(83, 141, 78, 0.15);
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
  z-index: 9999;
  pointer-events: none;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
              opacity 0.3s ease;
  opacity: 0;
}

.popup.popup-visible {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.popup.popup-exit {
  transform: translateX(-50%) translateY(-40%);
  opacity: 0;
  transition: transform 0.25s ease-in,
              opacity 0.25s ease-in;
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 999;
  color: white;
  font-size: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}
.overlay.show {
  opacity: 1;
  pointer-events: auto;
}

body.modal-open {
  overflow: hidden;
}

/*Display guesses section*/
.grid-container {
  margin-top: 55px;
  display: flex;
  justify-content: center;
}

.element-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-gap: 20px;
}

.element {
  position: relative;
  width: 250px;
  height: 250px;
  border: 2px solid rgb(97, 97, 97);
  border-radius: 15px;
  background-color: rgb(42, 42, 42);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: all 0.3s ease;
}

.element.guessed-element {
  overflow: hidden;
}

.element.guessed-element::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.35) 100%);
  pointer-events: none;
  z-index: 1;
}

.element.guessed-element:hover {
  transform: scale(1.025);
  box-shadow: rgba(255, 255, 255, 0.16) 0px 5px 18px 0px, rgba(255, 255, 255, 0.06) 0px 0px 0px 1px;
}

.name {
  font-size: 20px;
}

.atomic-number,
.family {
  position: absolute;
  color: rgba(255, 255, 255, 0.85);
  font-size: 20px;
}

.atomic-number {
  top: 5px;
  left: 5px;
}

.atomic-signal {
  display: inline-block;
}

.atomic-signal.signal-bounce {
  animation: signalBounce 0.5s ease-out;
}

@keyframes signalBounce {
  0% { transform: scale(1); }
  30% { transform: scale(1.5) translateY(-3px); }
  60% { transform: scale(0.9); }
  100% { transform: scale(1); }
}

.family {
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
}

.symbol {
  font-size: 80px;
}

.element-slot-number {
  font-size: 2rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.08);
  user-select: none;
}

.element:not(.guessed-element) {
  border-style: dashed;
  border-color: rgba(255, 255, 255, 0.12);
  background-color: rgba(42, 42, 42, 0.5);
}

.element:not(.guessed-element).next-slot {
  border-color: rgba(83, 141, 78, 0.45);
  animation: nextSlotPulse 2.4s ease-in-out infinite;
}

@keyframes nextSlotPulse {
  0%, 100% {
    border-color: rgba(83, 141, 78, 0.25);
    box-shadow: 0 0 0 0 rgba(83, 141, 78, 0);
  }
  50% {
    border-color: rgba(83, 141, 78, 0.55);
    box-shadow: 0 0 12px 2px rgba(83, 141, 78, 0.15);
  }
}

.element.shimmer {
  overflow: hidden;
  position: relative;
}

.element.shimmer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    110deg,
    transparent 25%,
    rgba(255, 255, 255, 0.04) 37%,
    rgba(255, 255, 255, 0.07) 50%,
    rgba(255, 255, 255, 0.04) 63%,
    transparent 75%
  );
  background-size: 300% 100%;
  animation: shimmerSlide 2s linear infinite;
}

@keyframes shimmerSlide {
  0% { background-position: 0% 0; }
  100% { background-position: 300% 0; }
}

.element.shimmer-done {
  animation: shimmerReveal 0.35s ease-out forwards;
}

.element.shimmer-done::after {
  display: none;
}

@keyframes shimmerReveal {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.element.card-flip {
  opacity: 0;
  transform: rotateX(90deg) scale(0.95);
  animation: cardFlip 0.65s ease-out forwards;
}

@keyframes cardFlip {
  0% {
    transform: rotateX(90deg) scale(0.95);
    opacity: 0;
  }
  50% {
    opacity: 1;
  }
  100% {
    transform: rotateX(0deg) scale(1);
    opacity: 1;
  }
}

.element.correct-card {
  border-color: rgb(83, 141, 78);
  animation: winGlow 2s ease-in-out infinite alternate;
}

.element.correct-card.card-flip {
  opacity: 0;
  transform: rotateX(90deg) scale(0.95);
  animation: cardFlip 0.65s ease-out forwards, winGlow 2s ease-in-out 0.65s infinite alternate;
}


@keyframes winGlow {
  from {
    box-shadow: 0 0 12px rgba(83, 141, 78, 0.4),
                0 0 24px rgba(83, 141, 78, 0.15);
  }
  to {
    box-shadow: 0 0 20px rgba(83, 141, 78, 0.6),
                0 0 40px rgba(83, 141, 78, 0.25);
  }
}

.green {
  color: rgb(83, 141, 78);
}

.family.family-flash {
  animation: familyFlash 0.8s ease-out 0.4s;
}

@keyframes familyFlash {
  0% {
    color: rgb(83, 141, 78);
    text-shadow: none;
  }
  30% {
    color: rgb(140, 220, 130);
    text-shadow: 0 0 8px rgba(83, 141, 78, 0.7), 0 0 20px rgba(83, 141, 78, 0.3);
  }
  100% {
    color: rgb(83, 141, 78);
    text-shadow: none;
  }
}

.yellow {
  color: rgb(181, 159, 59);
}

.reveal-answer {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-top: 24px;
  background: rgba(42, 42, 42, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  padding: 12px 22px;
  font-size: 1rem;
  color: rgba(255, 255, 255, 0.85);
}

.reveal-answer-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border-radius: 10px;
  background: linear-gradient(145deg, rgb(83, 141, 78), rgb(55, 100, 52));
  flex-shrink: 0;
}

.reveal-answer-badge-symbol {
  font-size: 1.3rem;
  font-weight: 700;
  color: #fff;
  line-height: 1;
}

.reveal-answer-badge-num {
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.7);
  line-height: 1;
  margin-top: 2px;
}

.reveal-answer-name {
  font-size: 1.1rem;
  font-weight: 600;
  color: #fff;
}

.reveal-answer-label {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.5);
  margin-top: 1px;
}

/*Shake animation*/
.shake {
  animation: shake 0.5s ease-in-out;
}

@keyframes shake {
  0% { transform: translateX(0); }
  15% { transform: translateX(-6px); }
  30% { transform: translateX(5px); }
  45% { transform: translateX(-4px); }
  60% { transform: translateX(3px); }
  75% { transform: translateX(-2px); }
  100% { transform: translateX(0); }
}

.glow-red {
  animation: redGlowFade 0.6s ease-out forwards;
}

@keyframes redGlowFade {
  0% {
    border-color: #f87171;
    box-shadow: 0 0 12px rgba(248, 113, 113, 0.6),
                0 0 24px rgba(248, 113, 113, 0.2);
  }
  100% {
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: none;
  }
}

/* Modal popups (Statistics &amp; How to Play) */
.modal-card {
  background: linear-gradient(165deg, #2d2d2d 0%, #1f1f1f 100%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  padding: 28px 32px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  color: white;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
  animation: modalAppear 0.25s ease-out;
  margin: auto;
}

@keyframes modalAppear {
  from {
    opacity: 0;
    transform: scale(0.96) translateY(-8px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.modal-card.modal-closing {
  animation: modalExit 0.2s ease-in forwards;
}

@keyframes modalExit {
  to {
    opacity: 0;
    transform: scale(0.96) translateY(8px);
  }
}

.modal-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 24px 0;
  letter-spacing: 0.02em;
  color: #fff;
}

.modal-back-button {
  font-size: 1rem;
  padding: 12px 28px;
  background-color: rgb(83, 141, 78);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 24px;
  transition: background-color 0.2s ease, transform 0.1s ease;
  font-family: inherit;
}

.modal-back-button:hover {
  background-color: rgb(98, 165, 92);
}

.modal-back-button:active {
  transform: scale(0.95);
  transition-duration: 0.05s;
}

/* Statistics modal */
.stats-modal .stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stats-modal .stat-item {
  background: rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transform: translateY(10px);
  animation: statFadeIn 0.4s ease-out forwards;
}

.stats-modal .stat-item:nth-child(1) { animation-delay: 0.1s; }
.stats-modal .stat-item:nth-child(2) { animation-delay: 0.18s; }
.stats-modal .stat-item:nth-child(3) { animation-delay: 0.26s; }
.stats-modal .stat-item:nth-child(4) { animation-delay: 0.34s; }
.stats-modal .stat-item:nth-child(5) { animation-delay: 0.42s; }

@keyframes statFadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.stats-modal .stat-item-wide {
  grid-column: span 2;
}

.stats-modal .stat-value {
  font-size: 1.75rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
  opacity: 0;
  transform: scale(0.7);
  animation: statPop 0.4s ease-out forwards;
}

.stats-modal .stat-item:nth-child(1) .stat-value { animation-delay: 0.2s; }
.stats-modal .stat-item:nth-child(2) .stat-value { animation-delay: 0.28s; }
.stats-modal .stat-item:nth-child(3) .stat-value { animation-delay: 0.36s; }
.stats-modal .stat-item:nth-child(4) .stat-value { animation-delay: 0.44s; }
.stats-modal .stat-item:nth-child(5) .stat-value { animation-delay: 0.52s; }

.stats-modal .stat-value.stat-pop-reset {
  animation: none;
  transform: scale(0.7);
  opacity: 0.4;
}

.stats-modal .stat-value.stat-pop {
  opacity: 1;
  transform: scale(1);
  animation: statPopUpdate 0.35s ease-out;
}

@keyframes statPop {
  to { opacity: 1; transform: scale(1); }
}

@keyframes statPopUpdate {
  0% { transform: scale(0.7); opacity: 0.4; }
  60% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.stats-modal .stat-label {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.65);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stats-modal .guess-distribution {
  text-align: left;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.stats-modal .distribution-title {
  font-size: 0.9rem;
  font-weight: 600;
  margin: 0 0 12px 0;
  color: rgba(255, 255, 255, 0.9);
}

.stats-modal .bars-container {
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  justify-content: center;
  gap: 10px;
  min-height: 120px;
}

.stats-modal .bar-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  min-width: 0;
}

.stats-modal .bar-count {
  font-size: 0.8rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
  margin-bottom: 6px;
  min-height: 1.2em;
}

.stats-modal .bar-track {
  width: 100%;
  height: 100px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 6px 6px 0 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.stats-modal .bar-fill {
  width: 100%;
  min-height: 4px;
  background: linear-gradient(180deg, rgb(98, 165, 92), rgb(83, 141, 78));
  border-radius: 6px 6px 0 0;
  transform: scaleY(0);
  transform-origin: bottom;
  animation: barGrow 0.5s ease-out forwards;
}

@keyframes barGrow {
  to {
    transform: scaleY(1);
  }
}

.stats-modal .bar-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.8);
  margin-top: 6px;
}

/* How to Play modal */
.help-modal {
  max-width: 480px;
  text-align: left;
}

.help-modal .modal-title {
  text-align: center;
}

.help-modal .help-content {
  margin-bottom: 8px;
}

.help-modal .help-intro {
  margin: 0 0 20px 0;
  line-height: 1.5;
  color: rgba(255, 255, 255, 0.9);
  font-size: 1rem;
  opacity: 0;
  animation: helpFadeIn 0.4s ease-out 0.05s forwards;
}

.help-modal .help-section {
  margin-bottom: 20px;
}

.help-modal .help-section-title {
  font-size: 0.95rem;
  font-weight: 600;
  margin: 0 0 10px 0;
  color: rgba(255, 255, 255, 0.95);
}

.help-modal .help-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.help-modal .help-list li {
  padding: 8px 0;
  padding-left: 28px;
  position: relative;
  line-height: 1.45;
  color: rgba(255, 255, 255, 0.85);
  font-size: 0.95rem;
  opacity: 0;
  transform: translateX(-8px);
  animation: helpItemIn 0.35s ease-out forwards;
}

.help-modal .help-list li:nth-child(1) { animation-delay: 0.15s; }
.help-modal .help-list li:nth-child(2) { animation-delay: 0.25s; }
.help-modal .help-list li:nth-child(3) { animation-delay: 0.35s; }
.help-modal .help-list li:nth-child(4) { animation-delay: 0.45s; }
.help-modal .help-list li:nth-child(5) { animation-delay: 0.55s; }

@keyframes helpItemIn {
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes helpFadeIn {
  to {
    opacity: 1;
  }
}

.help-modal .help-list li::before {
  content: &quot;•&quot;;
  position: absolute;
  left: 0;
  color: rgb(83, 141, 78);
  font-weight: bold;
}

.help-modal .help-icon {
  margin-right: 6px;
}

.help-modal .help-letter.green {
  color: rgb(83, 141, 78);
  font-weight: 600;
}

.help-modal .help-letter.yellow {
  color: rgb(181, 159, 59);
  font-weight: 600;
}

.help-modal .help-tip {
  margin: 0;
  padding: 12px 14px;
  background: rgba(83, 141, 78, 0.15);
  border-radius: 10px;
  font-size: 0.95rem;
  opacity: 0;
  animation: helpFadeIn 0.4s ease-out 0.65s forwards;
  color: rgba(255, 255, 255, 0.9);
}

.help-modal .modal-back-button {
  display: block;
  margin-left: auto;
  margin-right: auto;
}

/* Timebox */
.timebox {
  display: none;
  justify-content: center;
  margin-top: 28px;
}

.timebox p {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(42, 42, 42, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 12px 22px;
  font-size: 0.95rem;
  color: rgba(255, 255, 255, 0.75);
}


.timebox .countdown-text {
  margin-right: 4px;
}

.timebox .js-hours,
.timebox .js-minutes,
.timebox .js-seconds {
  font-family: &quot;Courier Prime&quot;, monospace;
  font-size: 1.15rem;
  font-weight: 700;
  color: rgb(98, 165, 92);
  min-width: 1.6ch;
  text-align: center;
}

.timebox .colon-text {
  font-family: &quot;Courier Prime&quot;, monospace;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.35);
}

/*Fade animation*/
@keyframes fadeInText {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.fade-in-text {
  animation: fadeInText 0.5s ease-in forwards;
}

.credit {
  opacity: 0.7;
}

/*Adjusting for screens under 1201px wide*/
@media (max-width: 1200px) {

  h1 {
    font-size: 50px;
  }

  .element {
    width: 200px;
    height: 200px;
    padding: 10px;
  }

  .element-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .atomic-number,
  .family {
    font-size: 16px;
  }

  .symbol {
    font-size: 64px;
  }

  .container {
    padding: 10px;
  }

  .modal-card {
    max-width: 95%;
    padding: 24px 20px;
  }

  .navbar {
    font-size: 30px;
  }
}

@media (max-width: 700px){
  .navbar {
    font-size: 25px;
  }
}

/* Wikipedia and Share buttons on mobile */
@media (max-width: 599px) {
  .correct-guess-container {
    align-items: stretch;
    gap: 12px;
  }

  .js-additional-info,
  .js-share-button {

}

/* Fire icon flicker + ember sparks */
.stats-fire-btn {
  position: relative;
  overflow: visible; /* let sparks escape the button bounds */
}

.stats-fire-btn i {
  position: relative;
  z-index: 2;
  animation: fireIconFlicker 2.4s ease-in-out infinite;
  transform-origin: center bottom;
}

@keyframes fireIconFlicker {
  0%, 100% {
    transform: scale(1) rotate(0deg);
    filter: brightness(1);
  }
  20% {
    transform: scale(1.05) rotate(-2deg);
    filter: brightness(1.15);
  }
  45% {
    transform: scale(0.96) rotate(1deg);
    filter: brightness(0.95);
  }
  70% {
    transform: scale(1.04) rotate(-1deg);
    filter: brightness(1.1);
  }
}

/* Ember sparks: small glowing dots drifting upward off the icon */
.stats-fire-btn::before,
.stats-fire-btn::after {
  content: '';
  position: absolute;
  bottom: 55%;
  left: 50%;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgb(251, 146, 60);
  box-shadow: 0 0 4px 1px rgba(251, 146, 60, 0.8);
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}

.stats-fire-btn::before {
  animation: emberRise1 1.8s ease-out infinite;
  animation-delay: 0.2s;
}

.stats-fire-btn::after {
  animation: emberRise2 2.2s ease-out infinite;
  animation-delay: 1s;
}

@keyframes emberRise1 {
  0% {
    opacity: 0;
    transform: translate(-50%, 0) scale(0.6);
  }
  15% {
    opacity: 1;
  }
  80% {
    opacity: 0.4;
  }
  100% {
    opacity: 0;
    transform: translate(-140%, -34px) scale(0.3);
  }
}

@keyframes emberRise2 {
  0% {
    opacity: 0;
    transform: translate(-50%, 0) scale(0.5);
  }
  15% {
    opacity: 1;
  }
  80% {
    opacity: 0.4;
  }
  100% {
    opacity: 0;
    transform: translate(60%, -30px) scale(0.25);
  }
}

/* Extra spark using a span we can inject, OR simulate with a radial glow pulse instead */
.stats-fire-btn.is-active {
  animation: fireBtnGlow 1.8s ease-in-out infinite alternate;
}

.stats-fire-btn.is-active i {
  animation: fireIconFlicker 1.4s ease-in-out infinite;
}

@keyframes loadingDots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

@keyframes mobileProfileArrive {

.hint-confirmation p { margin:6px 0 14px; font-size:.9rem; color:#c9d6c7; }
.hint-confirmation-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }

/* The daily post-game coach entry. */
.elbot-brand { color: rgb(83, 141, 78); }
.correct-guess-container.has-game-analysis { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); width:fit-content; max-width:100%; margin-left:auto; margin-right:auto; }

/* Reveal the finished-game controls once; syncing never restarts their entrance. */
.correct-guess-container.post-game-ready { animation:postGameEnter .38s ease-out both; }
.timebox.post-game-ready { animation:postGameEnter .38s ease-out .08s both; }

.freeze-progress { appearance:none; border:0; border-radius:6px; overflow:hidden; background:#424e57; }
.freeze-progress::-webkit-progress-bar { background:#424e57; border-radius:6px; }

.freeze-progress::-moz-progress-bar { background:#c4dce9; border-radius:6px; }
.streak-calendar .lab-week { color:#afc5d3; }

/* Reserve six weeks in both calendars so month changes never resize the boxes. */
.stats-layout { display:flex; flex-direction:column; box-sizing:border-box; }
.stats-layout .js-stats-page > .page-card { padding:0; }
.stats-section-divider { width:100%; height:0; flex:none; margin:20px 0; border:0; border-top:1px solid rgba(255,255,255,.1); }

.stats-layout .stats-calendar { box-sizing:border-box; width:100%; max-width:none; margin:0; padding:28px 28px 14px; text-align:left; }
.stats-calendar .lab-heading { height:44px; margin-bottom:16px; }
.stats-calendar .lab-heading h2 { margin:0; font-size:28px; }
.stats-calendar .calendar-body { display:grid; grid-template-rows:var(--calendar-intro-height,180px) 42px 16px 366px var(--calendar-legend-height,18px); gap:16px; }
.stats-calendar .calendar-body[hidden] { display:none; }
.stats-calendar .calendar-intro { position:relative; min-width:0; }
.stats-calendar .calendar-intro p { margin:12px 0; }

.stats-calendar .calendar-intro small { font-size:12px; line-height:1.6; color:#bdbdbd; }
.stats-calendar .lab-controls,.stats-calendar .lab-week,.stats-calendar .calendar-legend { margin:0; }
.stats-calendar .lab-days { grid-template-rows:repeat(6,56px); align-content:start; }

.stats-calendar .today .day-symbol,.calendar-legend .today-marker { color:#afc5d3; }
.stats-calendar .calendar-legend { align-content:start; align-items:start; gap:8px 12px; line-height:18px; }
.stats-calendar .calendar-status { margin:0; min-height:22px; font-size:12px; }
.freeze-scenery { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.freeze-scenery span { position:absolute; top:-70px; font-size:64px; color:#c4dce9; opacity:0; animation:freeze-drift 16s linear infinite; }
.freeze-scenery span:nth-child(1) { left:12%; }
.freeze-scenery span:nth-child(2) { left:52%; animation-delay:-5s; font-size:40px; }
.freeze-scenery span:nth-child(3) { left:80%; animation-delay:-10s; font-size:54px; }
@keyframes freeze-drift { 0% { transform:translate(0,0) rotate(0); opacity:0; } 15%,75% { opacity:.07; } 100% { transform:translate(24px,650px) rotate(100deg); opacity:0; } }
@media (max-width:600px) {

}

.stats-calendar .lab-days button { background:#262d32; border-color:#414e56; }
.stats-calendar .lab-days button:is(.solved,.complete) { border-color:#62a55c; }
.stats-calendar .lab-days button.today { border-color:#8ec987; }
.stats-calendar .today.solved .day-symbol { color:#8ec987; }
.stats-calendar .today.failed .day-symbol { color:#ee8585; }
.stats-calendar .today.frozen .day-symbol { color:#c4dce9; }

.stats-calendar .calendar-intro-content { display:flow-root; }

.stats-calendar .calendar-status:empty { display:none; }
.stats-calendar .calendar-status:not(:empty) { margin-top:8px; }


/* Completed main games open their saved elBot analysis. */
.streak-calendar .lab-days button.analyzable { position:relative; cursor:pointer; }
.streak-calendar .lab-days button.analyzable:hover,.streak-calendar .lab-days button.analyzable:focus-visible { background:#34412f; border-color:#a2c691; box-shadow:0 0 0 1px #91b780; }

.js-freeze-guest a { color: #8ec987; }

}

/* Family colors intentionally follow the game's classifications. */
.family-nonmetal { --family: #37903e; --family-surface: #203e2b; }
.family-noble-gas { --family: #c3a5ee; --family-surface: #372b4c; }
.family-alkali-metal { --family: #f0a590; --family-surface: #4b2b27; }
.family-alkaline-earth { --family: #e5c77b; --family-surface: #423b22; }
.family-metalloid { --family: #a8ce76; --family-surface: #323f24; }
.family-halogen { --family: #40e0d0; --family-surface: #203f3c; }
.family-metal { --family: #9fbdd5; --family-surface: #2b3947; }
.family-transition-metal { --family: #4d9cff; --family-surface: #16325a; }
.family-lanthanide { --family: #e5acd0; --family-surface: #482e40; }
.family-actinide { --family: #cca9a3; --family-surface: #44322f; }
.detail-header nav { flex-wrap: wrap; justify-content: center; }
.elements-overview { width: calc(100% - 48px); max-width: 1600px; margin: 44px auto 64px; overflow: visible; }
.elements-intro { margin-bottom: 28px; }
.elements-intro h1 { font-size: clamp(36px, 4vw, 54px); margin: 8px 0 12px; }
.elements-intro > p:last-child { font-size: 21px; color: #c1c1c1; }
.element-eyebrow { font-size: 15px; letter-spacing: .09em; text-transform: uppercase; color: #97c78c; }
.periodic-scroll { overflow-x: auto; padding: 8px 4px 16px; scrollbar-color: #659b59 #262626; }
.periodic-table { display: grid; grid-template-columns: repeat(18, minmax(56px, 1fr)); grid-template-rows: 22px repeat(7, minmax(86px, auto)) 20px repeat(2, minmax(86px, auto)); gap: 5px; min-width: 1110px; }
.periodic-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; padding: 7px 3px 6px; min-width: 0; background: var(--family-surface); color: var(--family); border: 1px solid var(--family); border-radius: 5px; text-decoration: none; transition: transform .15s, filter .15s; }
a.periodic-cell:hover { transform: translateY(-3px); filter: brightness(1.2); z-index: 1; }
a.periodic-cell:focus-visible { outline: 3px solid #fff; outline-offset: 2px; z-index: 2; }
.cell-number { align-self: flex-start; font-size: 13px; line-height: 1; padding-left: 3px; }
.cell-symbol { font-size: clamp(25px, 2.2vw, 36px); font-weight: bold; line-height: 1.15; margin: auto 0; }
.cell-name { font-size: clamp(9px, .78vw, 13px); text-align: center; color: #f1f1f1; line-height: 1.2; }
.group-number { color: #8e8e8e; text-align: center; font-size: 14px; }
.table-key { grid-column: 5 / 12; grid-row: 2 / 4; align-self: center; justify-self: center; display: grid; gap: 4px; text-align: center; color: #c7c7c7; font-size: 16px; min-width: 168px; padding: 14px 22px 12px; border: 1px solid #6a6a6a; border-radius: 8px; background: #252525; }
.table-key strong { color: #f1f1f1; font-size: 28px; line-height: 1.15; }
.series-placeholder { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:8px; color:var(--family); background:var(--family-surface); border:1px dashed var(--family); border-radius:5px; font-size:16px; text-decoration:none; }
.series-placeholder span { font-size:10px; }
.series-label { display:flex; align-items:center; color:#bdbdbd; font-size:17px; scroll-margin-top:20px; }
.family-legend { margin-top: 24px; }
.family-legend h2 { font-size: 24px; margin-bottom: 16px; }
.family-legend ul { list-style: none; display: flex; flex-wrap: wrap; gap: 14px 24px; }
.family-legend li { display: flex; gap: 8px; align-items: center; font-size: 18px; }
.legend-swatch { width: 15px; height: 15px; border-radius: 3px; background: var(--family-surface); border: 1px solid var(--family); }
.family-legend p, .element-source { font-size: 17px; color: #aaa; margin-top: 18px; line-height:1.5; }
.element-source a, .element-detail a { color: #a4d397; }
.table-scroll-hint { display: none; font-size: 16px; color: #aaa; }
.element-detail { padding: 0 24px; }
.element-breadcrumb { display:flex; gap:12px; font-size:18px; margin-bottom:28px; }
.element-breadcrumb a { text-decoration:none; }
.element-breadcrumb span { color:#aaa; }
.element-hero { display:flex; align-items:center; gap:24px; margin-bottom:32px; }
.element-hero h1 { font-size:clamp(36px, 4vw, 56px); margin:8px 0; overflow-wrap:anywhere; }
.element-hero > div:last-child { min-width:0; }
.element-hero > div > p:last-child { color:#aaa; font-size:20px; }
.element-hero-tile { width:126px; height:142px; flex-shrink:0; padding:12px; }
.element-hero-tile .cell-number { font-size:18px; }
.element-hero-tile .cell-symbol { font-size:52px; }
.element-hero-tile .cell-name { font-size:16px; }
.element-description { font-size:20px; line-height:1.65; }
.element-description p { margin:0 0 20px; color:#cecece; }
.element-description .element-lede { font-size:22px; color:#eee; }
.element-description h2, .element-sources h2 { font-size:27px; line-height:1.3; margin:32px 0 14px; }
.element-editorial { margin:32px 0; }
.element-signatures { margin:32px 0 38px; }
.element-signatures h2 { margin-bottom:18px; }
.element-signatures ol { list-style:none; display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; padding:0; }
.element-signatures li { display:flex; align-items:flex-start; gap:12px; min-width:0; padding:18px; border:1px solid #3d4939; border-radius:10px; background:#222820; }
.element-signatures li > span { display:grid; place-items:center; width:30px; height:30px; flex:0 0 30px; border-radius:50%; background:#365d30; color:#e8f5e5; font-size:15px; font-weight:bold; }
.element-signatures li p { margin:2px 0 0; color:#e1e1e1; font-size:18px; line-height:1.55; }
.element-properties { width:100%; border-collapse:collapse; font-size:19px; margin:32px 0 16px; }
.element-properties caption { text-align:left; font-size:28px; margin-bottom:16px; font-weight:bold; }
.element-properties th, .element-properties td { padding:13px 12px; border-bottom:1px solid #383838; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
.element-properties th { width:44%; font-weight:normal; color:#bbb; }
.element-properties td { color:#eee; }
.element-properties tr:nth-child(odd) { background:rgba(255,255,255,.025); }
.element-data-note, .element-sources p { font-size:16px; line-height:1.5; color:#999; margin-bottom:12px; }
.element-cycle { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; margin-top:40px; padding-top:24px; border-top:1px solid #383838; }
.element-cycle a { text-decoration:none; display:flex; flex-direction:column; gap:7px; padding:12px; border-radius:8px; }
.element-cycle a:hover { background:#253020; }
.element-cycle a:last-child { text-align:right; }
.element-cycle span { font-size:16px; color:#aaa; }
.element-cycle strong { font-size:20px; font-weight:normal; }
.element-cycle .cycle-table { font-size:17px; text-align:center; }
@media (max-width: 1180px) {
  .elements-overview { width:100%; margin-top:28px; }
  .elements-intro, .family-legend, .element-source, .table-scroll-hint { margin-left:18px; margin-right:18px; }
  .periodic-scroll { padding-left:18px; padding-right:18px; }
  .table-scroll-hint { display:block; margin-bottom:12px; }
  .element-detail { padding:0 24px; }
}
@media (max-width: 480px) {
  .element-detail { padding:0 18px; }
  .element-hero { gap:16px; }
  .element-hero-tile { width:92px; height:112px; padding:8px; }
  .element-hero-tile .cell-symbol { font-size:40px; }
  .element-hero-tile .cell-name { font-size:12px; }
  .element-hero .element-eyebrow { font-size:12px; }
  .element-cycle { grid-template-columns:1fr 1fr; }
  .element-cycle .cycle-table { grid-column:1 / -1; grid-row:2; }
  .element-properties { font-size:17px; }
  .element-properties th, .element-properties td { padding:12px 8px; }
  .element-signatures ol { grid-template-columns:1fr; }
}
@media (min-width:481px) and (max-width:800px) { .element-signatures ol { grid-template-columns:1fr; } }
@media (prefers-reduced-motion: reduce) { .periodic-cell { transition:none; } }

/* One composited camera move reveals the already-rendered table. */
.vault-entry { transform-origin: 43% 48%; }
.vault-main { transform-origin: 50% 50%; }
.vault-entering .vault-main { opacity: 0; }
.vault-revealing .vault-main { opacity: 1; }
.vault-entering .vault-progress > span { animation-play-state: paused; }
.vault-progress > span { transform-origin: left center; }
.vault-entry.zooming { pointer-events: none; will-change: transform, opacity; }
.vault-entry.opening .vault-door { transition-duration: 1.8s; }
.vault-entry.opening .vault-corridor { animation: none; }
.vault-entry .vault-door, .vault-entry .vault-wheel { will-change: transform; }
@media (max-width: 700px) { .vault-entry { transform-origin: 50% 38%; } }

.tier-help button, .tier-tooltip { font-family:&quot;Iceland&quot;,sans-serif; }
.tier-tooltip { font-size:16px; }

/* Stack the entrance controls in document flow on phones, including short screens. */
@media (max-width:700px) {
  .vault-corridor { height:auto; min-height:100vh; min-height:100dvh; padding:16px 12px; }
  .vault-wall { height:auto; min-height:0; padding:20px 16px 10px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px 8px; box-shadow:inset 0 0 100px #000,0 0 0 6px #101612,0 0 0 7px #313d34; }
  .vault-lintel { position:static; grid-column:1/-1; line-height:1.5; }
  .vault-door-frame { position:relative; left:auto; top:auto; width:auto; height:clamp(260px,43svh,380px); margin:0 8px; grid-column:1/-1; }
  .vault-panel { position:static; width:auto; min-width:0; grid-column:1/-1; }
  .vault-panel .scanner { grid-column:1; grid-row:1/4; align-self:center; }
  .vault-panel small { grid-row:4; }
  .entry-exit,.entry-skip { position:static; min-width:0; min-height:44px; padding:8px 0; display:flex; align-items:center; font-size:10px; line-height:1.5; }
  .entry-exit { grid-column:1; justify-content:flex-start; }
  .entry-skip { grid-column:2; justify-content:flex-end; text-align:right; }
  .vault-element-hero > div:last-child { min-width:0; }
  .vault-element-hero h1 { font-size:clamp(26px,7vw,36px); overflow-wrap:anywhere; }
  .vault-element-hero .element-eyebrow { font-size:11px; }
  .tier-milestones { flex-wrap:wrap; }
}
