  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5),
              0 0 0 1px rgba(83, 141, 78, 0.08);
  max-height: 260px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
  animation: acDropIn 0.18s ease-out;
  transform-origin: top center;
}

@keyframes acDropIn {
  from {
    opacity: 0;
    transform: scaleY(0.6) translateY(-4px);
  }
  to {
    opacity: 1;
    transform: scaleY(1) translateY(0);
  }
}

.autocomplete-list::-webkit-scrollbar {
  width: 6px;
}

.autocomplete-list::-webkit-scrollbar-track {
  background: transparent;
}

.autocomplete-list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
}

.autocomplete-list li {
  border: none;
  background: transparent;
}

.autocomplete-list button {
  border: none;
  background: transparent;
  color: rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 11px 16px;
  font-size: 1.15rem;
  font-family: inherit;
  cursor: pointer;
  border-radius: 8px;
  margin: 0 6px;
  width: calc(100% - 12px);
  transition: background 0.15s ease, color 0.15s ease;
}

.autocomplete-list button:hover,
.autocomplete-list button:focus-visible,
.autocomplete-list button.ac-active {
  background: rgba(83, 141, 78, 0.2);
  color: #fff;
  outline: none;
}

.autocomplete-list button.ac-active {
  border-left: 3px solid rgb(83, 141, 78);
  padding-left: 13px;
}

.autocomplete-list button .ac-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.autocomplete-list button .ac-match {
  color: rgb(98, 165, 92);
  font-weight: 700;
}

.autocomplete-wrapper {
  display: inline-block;
  position: relative;
}

.input-clear-btn {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  min-width: 32px;
  min-height: 32px;
  display: none;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.4);
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  border-radius: 50%;
  transition: color 0.15s ease, background 0.15s ease;
  z-index: 2;
}

.input-clear-btn.visible {
  display: flex;
}

.input-clear-btn:hover {
  color: rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.1);
}

.input-clear-btn:active {
  transform: translateY(-50%) scale(0.9);
  transition-duration: 0.05s;
}

/*Display results*/
.correct-guess-container {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

.js-additional-info,
.js-share-button {
  display: flex;
}

a.additional-info,
.share-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: auto;
  line-height: normal;
  padding: 10px 18px;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.07);
  color: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  font-size: 0.95rem;
  font-family: inherit;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}

a.additional-info:hover,
.share-button:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-1px);
}

a.additional-info:active,
.share-button:active {
  transform: scale(0.95);
  transition-duration: 0.05s;
}

.guess-button:disabled {
  border-color: rgba(255, 255, 255, 0.25);
}

/*Popup*/
.popup {
  position: fixed;
  top: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(-120%);
  background: rgba(38, 38, 38, 0.95);
  color: #fff;
  padding: 16px 36px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(83, 141, 78, 0.15);
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
  z-index: 9999;
  pointer-events: none;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
              opacity 0.3s ease;
  opacity: 0;
}

.popup.popup-visible {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.popup.popup-exit {
  transform: translateX(-50%) translateY(-40%);
  opacity: 0;
  transition: transform 0.25s ease-in,
              opacity 0.25s ease-in;
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 999;
  color: white;
  font-size: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}
.overlay.show {
  opacity: 1;
  pointer-events: auto;
}

body.modal-open {
  overflow: hidden;
}

/*Display guesses section*/
.grid-container {
  margin-top: 55px;
  display: flex;
  justify-content: center;
}

.element-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-gap: 20px;
}

.element {
  position: relative;
  width: 250px;
  height: 250px;
  border: 2px solid rgb(97, 97, 97);
  border-radius: 15px;
  background-color: rgb(42, 42, 42);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: all 0.3s ease;
}

.element.guessed-element {
  overflow: hidden;
}

.element.guessed-element::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.35) 100%);
  pointer-events: none;
  z-index: 1;
}

.element.guessed-element:hover {
  transform: scale(1.025);
  box-shadow: rgba(255, 255, 255, 0.16) 0px 5px 18px 0px, rgba(255, 255, 255, 0.06) 0px 0px 0px 1px;
}

.name {
  font-size: 20px;
}

.atomic-number,
.family {
  position: absolute;
  color: rgba(255, 255, 255, 0.85);
  font-size: 20px;
}

.atomic-number {
  top: 5px;
  left: 5px;
}

.atomic-signal {
  display: inline-block;
}

.atomic-signal.signal-bounce {
  animation: signalBounce 0.5s ease-out;
}

@keyframes signalBounce {
  0% { transform: scale(1); }
  30% { transform: scale(1.5) translateY(-3px); }
  60% { transform: scale(0.9); }
  100% { transform: scale(1); }
}

.family {
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
}

.symbol {
  font-size: 80px;
}

.element-slot-number {
  font-size: 2rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.08);
  user-select: none;
}

.element:not(.guessed-element) {
  border-style: dashed;
  border-color: rgba(255, 255, 255, 0.12);
  background-color: rgba(42, 42, 42, 0.5);
}

.element:not(.guessed-element).next-slot {
  border-color: rgba(83, 141, 78, 0.45);
  animation: nextSlotPulse 2.4s ease-in-out infinite;
}

@keyframes nextSlotPulse {
  0%, 100% {
    border-color: rgba(83, 141, 78, 0.25);
    box-shadow: 0 0 0 0 rgba(83, 141, 78, 0);
  }
  50% {
    border-color: rgba(83, 141, 78, 0.55);
    box-shadow: 0 0 12px 2px rgba(83, 141, 78, 0.15);
  }
}

.element.shimmer {
  overflow: hidden;
  position: relative;
}

.element.shimmer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    110deg,
    transparent 25%,
    rgba(255, 255, 255, 0.04) 37%,
    rgba(255, 255, 255, 0.07) 50%,
    rgba(255, 255, 255, 0.04) 63%,
    transparent 75%
  );
  background-size: 300% 100%;
  animation: shimmerSlide 2s linear infinite;
}

@keyframes shimmerSlide {
  0% { background-position: 0% 0; }
  100% { background-position: 300% 0; }
}

.element.shimmer-done {
  animation: shimmerReveal 0.35s ease-out forwards;
}

.element.shimmer-done::after {
  display: none;
}

@keyframes shimmerReveal {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.element.card-flip {
  opacity: 0;
  transform: rotateX(90deg) scale(0.95);
  animation: cardFlip 0.65s ease-out forwards;
}

@keyframes cardFlip {
  0% {
    transform: rotateX(90deg) scale(0.95);
    opacity: 0;
  }
  50% {
    opacity: 1;
  }
  100% {
    transform: rotateX(0deg) scale(1);
    opacity: 1;
  }
}

.element.correct-card {
  border-color: rgb(83, 141, 78);
  animation: winGlow 2s ease-in-out infinite alternate;
}

.element.correct-card.card-flip {
  opacity: 0;
  transform: rotateX(90deg) scale(0.95);
  animation: cardFlip 0.65s ease-out forwards, winGlow 2s ease-in-out 0.65s infinite alternate;
}


@keyframes winGlow {
  from {
    box-shadow: 0 0 12px rgba(83, 141, 78, 0.4),
                0 0 24px rgba(83, 141, 78, 0.15);
  }
  to {
    box-shadow: 0 0 20px rgba(83, 141, 78, 0.6),
                0 0 40px rgba(83, 141, 78, 0.25);
  }
}

.green {
  color: rgb(83, 141, 78);
}

.family.family-flash {
  animation: familyFlash 0.8s ease-out 0.4s;
}

@keyframes familyFlash {
  0% {
    color: rgb(83, 141, 78);
    text-shadow: none;
  }
  30% {
    color: rgb(140, 220, 130);
    text-shadow: 0 0 8px rgba(83, 141, 78, 0.7), 0 0 20px rgba(83, 141, 78, 0.3);
  }
  100% {
    color: rgb(83, 141, 78);
    text-shadow: none;
  }
}

.yellow {
  color: rgb(181, 159, 59);
}

.reveal-answer {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-top: 24px;
  background: rgba(42, 42, 42, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  padding: 12px 22px;
  font-size: 1rem;
  color: rgba(255, 255, 255, 0.85);
}

.reveal-answer-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border-radius: 10px;
  background: linear-gradient(145deg, rgb(83, 141, 78), rgb(55, 100, 52));
  flex-shrink: 0;
}

.reveal-answer-badge-symbol {
  font-size: 1.3rem;
  font-weight: 700;
  color: #fff;
  line-height: 1;
}

.reveal-answer-badge-num {
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.7);
  line-height: 1;
  margin-top: 2px;
}

.reveal-answer-name {
  font-size: 1.1rem;
  font-weight: 600;
  color: #fff;
}

.reveal-answer-label {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.5);
  margin-top: 1px;
}

/*Shake animation*/
.shake {
  animation: shake 0.5s ease-in-out;
}

@keyframes shake {
  0% { transform: translateX(0); }
  15% { transform: translateX(-6px); }
  30% { transform: translateX(5px); }
  45% { transform: translateX(-4px); }
  60% { transform: translateX(3px); }
  75% { transform: translateX(-2px); }
  100% { transform: translateX(0); }
}

.glow-red {
  animation: redGlowFade 0.6s ease-out forwards;
}

@keyframes redGlowFade {
  0% {
    border-color: #f87171;
    box-shadow: 0 0 12px rgba(248, 113, 113, 0.6),
                0 0 24px rgba(248, 113, 113, 0.2);
  }
  100% {
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: none;
  }
}

/* Modal popups (Statistics &amp; How to Play) */
.modal-card {
  background: linear-gradient(165deg, #2d2d2d 0%, #1f1f1f 100%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  padding: 28px 32px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  color: white;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
  animation: modalAppear 0.25s ease-out;
  margin: auto;
}

@keyframes modalAppear {
  from {
    opacity: 0;
    transform: scale(0.96) translateY(-8px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.modal-card.modal-closing {
  animation: modalExit 0.2s ease-in forwards;
}

@keyframes modalExit {
  to {
    opacity: 0;
    transform: scale(0.96) translateY(8px);
  }
}

.modal-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 24px 0;
  letter-spacing: 0.02em;
  color: #fff;
}

.modal-back-button {
  font-size: 1rem;
  padding: 12px 28px;
  background-color: rgb(83, 141, 78);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 24px;
  transition: background-color 0.2s ease, transform 0.1s ease;
  font-family: inherit;
}

.modal-back-button:hover {
  background-color: rgb(98, 165, 92);
}

.modal-back-button:active {
  transform: scale(0.95);
  transition-duration: 0.05s;
}

/* Statistics modal */
.stats-modal .stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stats-modal .stat-item {
  background: rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transform: translateY(10px);
  animation: statFadeIn 0.4s ease-out forwards;
}

.stats-modal .stat-item:nth-child(1) { animation-delay: 0.1s; }
.stats-modal .stat-item:nth-child(2) { animation-delay: 0.18s; }
.stats-modal .stat-item:nth-child(3) { animation-delay: 0.26s; }
.stats-modal .stat-item:nth-child(4) { animation-delay: 0.34s; }
.stats-modal .stat-item:nth-child(5) { animation-delay: 0.42s; }

@keyframes statFadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.stats-modal .stat-item-wide {
  grid-column: span 2;
}

.stats-modal .stat-value {
  font-size: 1.75rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
  opacity: 0;
  transform: scale(0.7);
  animation: statPop 0.4s ease-out forwards;
}

.stats-modal .stat-item:nth-child(1) .stat-value { animation-delay: 0.2s; }
.stats-modal .stat-item:nth-child(2) .stat-value { animation-delay: 0.28s; }
.stats-modal .stat-item:nth-child(3) .stat-value { animation-delay: 0.36s; }
.stats-modal .stat-item:nth-child(4) .stat-value { animation-delay: 0.44s; }
.stats-modal .stat-item:nth-child(5) .stat-value { animation-delay: 0.52s; }

.stats-modal .stat-value.stat-pop-reset {
  animation: none;
  transform: scale(0.7);
  opacity: 0.4;
}

.stats-modal .stat-value.stat-pop {
  opacity: 1;
  transform: scale(1);
  animation: statPopUpdate 0.35s ease-out;
}

@keyframes statPop {
  to { opacity: 1; transform: scale(1); }
}

@keyframes statPopUpdate {
  0% { transform: scale(0.7); opacity: 0.4; }
  60% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.stats-modal .stat-label {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.65);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stats-modal .guess-distribution {
  text-align: left;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.stats-modal .distribution-title {
  font-size: 0.9rem;
  font-weight: 600;
  margin: 0 0 12px 0;
  color: rgba(255, 255, 255, 0.9);
}

.stats-modal .bars-container {
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  justify-content: center;
  gap: 10px;
  min-height: 120px;
}

.stats-modal .bar-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  min-width: 0;
}

.stats-modal .bar-count {
  font-size: 0.8rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
  margin-bottom: 6px;
  min-height: 1.2em;
}

.stats-modal .bar-track {
  width: 100%;
  height: 100px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 6px 6px 0 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.stats-modal .bar-fill {
  width: 100%;
  min-height: 4px;
  background: linear-gradient(180deg, rgb(98, 165, 92), rgb(83, 141, 78));
  border-radius: 6px 6px 0 0;
  transform: scaleY(0);
  transform-origin: bottom;
  animation: barGrow 0.5s ease-out forwards;
}

@keyframes barGrow {
  to {
    transform: scaleY(1);
  }
}

.stats-modal .bar-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.8);
  margin-top: 6px;
}

/* How to Play modal */
.help-modal {
  max-width: 480px;
  text-align: left;
}

.help-modal .modal-title {
  text-align: center;
}

.help-modal .help-content {
  margin-bottom: 8px;
}

.help-modal .help-intro {
  margin: 0 0 20px 0;
  line-height: 1.5;
  color: rgba(255, 255, 255, 0.9);
  font-size: 1rem;
  opacity: 0;
  animation: helpFadeIn 0.4s ease-out 0.05s forwards;
}

.help-modal .help-section {
  margin-bottom: 20px;
}

.help-modal .help-section-title {
  font-size: 0.95rem;
  font-weight: 600;
  margin: 0 0 10px 0;
  color: rgba(255, 255, 255, 0.95);
}

.help-modal .help-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.help-modal .help-list li {
  padding: 8px 0;
  padding-left: 28px;
  position: relative;
  line-height: 1.45;
  color: rgba(255, 255, 255, 0.85);
  font-size: 0.95rem;
  opacity: 0;
  transform: translateX(-8px);
  animation: helpItemIn 0.35s ease-out forwards;
}

.help-modal .help-list li:nth-child(1) { animation-delay: 0.15s; }
.help-modal .help-list li:nth-child(2) { animation-delay: 0.25s; }
.help-modal .help-list li:nth-child(3) { animation-delay: 0.35s; }
.help-modal .help-list li:nth-child(4) { animation-delay: 0.45s; }
.help-modal .help-list li:nth-child(5) { animation-delay: 0.55s; }

@keyframes helpItemIn {
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes helpFadeIn {
  to {
    opacity: 1;
  }
}

.help-modal .help-list li::before {
  content: &quot;•&quot;;
  position: absolute;
  left: 0;
  color: rgb(83, 141, 78);
  font-weight: bold;
}

.help-modal .help-icon {
  margin-right: 6px;
}

.help-modal .help-letter.green {
  color: rgb(83, 141, 78);
  font-weight: 600;
}

.help-modal .help-letter.yellow {
  color: rgb(181, 159, 59);
  font-weight: 600;
}

.help-modal .help-tip {
  margin: 0;
  padding: 12px 14px;
  background: rgba(83, 141, 78, 0.15);
  border-radius: 10px;
  font-size: 0.95rem;
  opacity: 0;
  animation: helpFadeIn 0.4s ease-out 0.65s forwards;
  color: rgba(255, 255, 255, 0.9);
}

.help-modal .modal-back-button {
  display: block;
  margin-left: auto;
  margin-right: auto;
}

/* Timebox */
.timebox {
  display: none;
  justify-content: center;
  margin-top: 28px;
}

.timebox p {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(42, 42, 42, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 12px 22px;
  font-size: 0.95rem;
  color: rgba(255, 255, 255, 0.75);
}


.timebox .countdown-text {
  margin-right: 4px;
}

.timebox .js-hours,
.timebox .js-minutes,
.timebox .js-seconds {
  font-family: &quot;Courier Prime&quot;, monospace;
  font-size: 1.15rem;
  font-weight: 700;

/* Fire icon flicker + ember sparks */
.stats-fire-btn {
  position: relative;
  overflow: visible; /* let sparks escape the button bounds */
}

.stats-fire-btn i {
  position: relative;
  z-index: 2;
  animation: fireIconFlicker 2.4s ease-in-out infinite;
  transform-origin: center bottom;
}

@keyframes fireIconFlicker {
  0%, 100% {
    transform: scale(1) rotate(0deg);
    filter: brightness(1);
  }
  20% {
    transform: scale(1.05) rotate(-2deg);
    filter: brightness(1.15);
  }
  45% {
    transform: scale(0.96) rotate(1deg);
    filter: brightness(0.95);
  }
  70% {
    transform: scale(1.04) rotate(-1deg);
    filter: brightness(1.1);
  }
}

/* Ember sparks: small glowing dots drifting upward off the icon */
.stats-fire-btn::before,
.stats-fire-btn::after {
  content: '';
  position: absolute;
  bottom: 55%;
  left: 50%;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgb(251, 146, 60);
  box-shadow: 0 0 4px 1px rgba(251, 146, 60, 0.8);
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}

.stats-fire-btn::before {
  animation: emberRise1 1.8s ease-out infinite;
  animation-delay: 0.2s;
}

.stats-fire-btn::after {
  animation: emberRise2 2.2s ease-out infinite;
  animation-delay: 1s;
}

@keyframes emberRise1 {
  0% {
    opacity: 0;
    transform: translate(-50%, 0) scale(0.6);
  }
  15% {
    opacity: 1;
  }
  80% {
    opacity: 0.4;
  }
  100% {
    opacity: 0;
    transform: translate(-140%, -34px) scale(0.3);
  }
}

@keyframes emberRise2 {
  0% {
    opacity: 0;
    transform: translate(-50%, 0) scale(0.5);
  }
  15% {
    opacity: 1;
  }
  80% {
    opacity: 0.4;
  }
  100% {
    opacity: 0;
    transform: translate(60%, -30px) scale(0.25);
  }
}

/* Extra spark using a span we can inject, OR simulate with a radial glow pulse instead */
.stats-fire-btn.is-active {
  animation: fireBtnGlow 1.8s ease-in-out infinite alternate;
}

.stats-fire-btn.is-active i {
  animation: fireIconFlicker 1.4s ease-in-out infinite;
}

@keyframes loadingDots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

/* Family colors intentionally follow the game's classifications. */

.family-alkali-metal { --family: #f0a590; --family-surface: #4b2b27; }
.family-alkaline-earth { --family: #e5c77b; --family-surface: #423b22; }
.family-metalloid { --family: #a8ce76; --family-surface: #323f24; }
.family-halogen { --family: #40e0d0; --family-surface: #203f3c; }
.family-metal { --family: #9fbdd5; --family-surface: #2b3947; }
.family-transition-metal { --family: #4d9cff; --family-surface: #16325a; }
.family-lanthanide { --family: #e5acd0; --family-surface: #482e40; }
.family-actinide { --family: #cca9a3; --family-surface: #44322f; }
.detail-header nav { flex-wrap: wrap; justify-content: center; }

.element-eyebrow { font-size: 15px; letter-spacing: .09em; text-transform: uppercase; color: #97c78c; }
.periodic-scroll { overflow-x: auto; padding: 8px 4px 16px; scrollbar-color: #659b59 #262626; }
.periodic-table { display: grid; grid-template-columns: repeat(18, minmax(56px, 1fr)); grid-template-rows: 22px repeat(7, minmax(86px, auto)) 20px repeat(2, minmax(86px, auto)); gap: 5px; min-width: 1110px; }
.periodic-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; padding: 7px 3px 6px; min-width: 0; background: var(--family-surface); color: var(--family); border: 1px solid var(--family); border-radius: 5px; text-decoration: none; transition: transform .15s, filter .15s; }

.group-number { color: #8e8e8e; text-align: center; font-size: 14px; }

.element-signatures li > span { display:grid; place-items:center; width:30px; height:30px; flex:0 0 30px; border-radius:50%; background:#365d30; color:#e8f5e5; font-size:15px; font-weight:bold; }

@media (max-width: 1180px) {

@media (prefers-reduced-motion: reduce) { .periodic-cell { transition:none; } }

.vault-entry .vault-door, .vault-entry .vault-wheel { will-change: transform; }

  50% {
    color: rgb(140, 210, 135);
    text-shadow: 0 0 8px rgba(98, 165, 92, 0.6), 0 0 20px rgba(98, 165, 92, 0.2);
  }
}

@keyframes nFlicker2 {
  0%, 100% { color: rgb(98, 165, 92); text-shadow: none; }
  25% {
    color: rgb(140, 210, 135);
    text-shadow: 0 0 8px rgba(98, 165, 92, 0.6), 0 0 20px rgba(98, 165, 92, 0.2);
  }
  50% { color: rgb(98, 165, 92); text-shadow: none; }
  75% {
    color: rgb(150, 220, 140);
    text-shadow: 0 0 10px rgba(98, 165, 92, 0.7), 0 0 28px rgba(98, 165, 92, 0.25);
  }
}

@keyframes nFlicker3 {
  0%, 100% { color: rgb(98, 165, 92); text-shadow: none; }
  17% {
    color: rgb(140, 210, 135);
    text-shadow: 0 0 8px rgba(98, 165, 92, 0.6), 0 0 20px rgba(98, 165, 92, 0.2);
  }
  33% { color: rgb(98, 165, 92); text-shadow: none; }
  50% {
    color: rgb(150, 220, 140);
    text-shadow: 0 0 10px rgba(98, 165, 92, 0.7), 0 0 28px rgba(98, 165, 92, 0.25);
  }
  67% { color: rgb(98, 165, 92); text-shadow: none; }
  83% {
    color: rgb(135, 205, 130);
    text-shadow: 0 0 6px rgba(98, 165, 92, 0.5), 0 0 16px rgba(98, 165, 92, 0.15);
  }
}

/*Guessing area*/
.guess-form {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  position: relative;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
}

.guess-row {
  display: flex;
  align-items: stretch;
  gap: 6px;
  width: 100%;
  max-width: 440px;
}

.guess-row .autocomplete-wrapper {
  flex: 1;
  min-width: 0;
}

.guess-row .guess-input {
  width: 100%;
}

.guess-row .guess-button {
  flex-shrink: 0;
}

.guess-input {
  font-size: 1.3rem;
  padding: 12px 32px 12px 14px;
  background-color: rgb(42, 42, 42);
  border: 2px solid rgba(255, 255, 255, 0.25);
  color: white;
  width: 300px;
  border-radius: 10px;
  font-family: inherit;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.guess-input:-webkit-autofill,
.guess-input:-webkit-autofill:hover,
.guess-input:-webkit-autofill:focus,
.guess-input:-webkit-autofill:active {
  -webkit-box-shadow: 0 0 0 1000px rgb(42, 42, 42) inset !important;
  box-shadow: 0 0 0 1000px rgb(42, 42, 42) inset !important;
  -webkit-text-fill-color: #fff !important;
  caret-color: #fff;
}

.guess-input:autofill {
  box-shadow: 0 0 0 1000px rgb(42, 42, 42) inset;
  color: #fff;
}

.guess-input:focus {
  outline: none;
  border-color: rgb(83, 141, 78);
  box-shadow: 0 0 0 3px rgba(83, 141, 78, 0.25);
}

.guess-input:disabled,
.guess-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  filter: grayscale(0.4);
}

.guess-button,
.hint-button {
  font-size: 1.05rem;
  font-family: inherit;
  font-weight: 600;
  padding: 12px 0;
  border: none;
  background: linear-gradient(180deg, rgb(98, 165, 92), rgb(70, 125, 66));
  color: white;
  width: 110px;
  border-radius: 10px;
  transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
  box-shadow: 0 2px 8px rgba(83, 141, 78, 0.3);
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

.hint-button {
  width: 46px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  flex-shrink: 0;
}

.hint-container {
  position: absolute;
  top: calc(100% + 12px);
  left: 0;
  right: 0;
  z-index: 8;
  padding: 13px 18px 14px;
  font-size: 1.05rem;
  color: rgba(255, 255, 255, 0.92);
  background: linear-gradient(145deg, rgba(48, 62, 48, 0.98), rgba(32, 40, 32, 0.98));
  border: 1px solid rgba(98, 165, 92, 0.38);
  border-radius: 12px;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(98, 165, 92, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-5px);
  text-align: center;
  line-height: 1.4;
}

.hint-container::before {
  content: '';
  position: absolute;
  top: -6px;
  right: 16px;
  width: 11px;
  height: 11px;
  background: rgba(48, 62, 48, 0.98);
  border-top: 1px solid rgba(98, 165, 92, 0.38);
  border-left: 1px solid rgba(98, 165, 92, 0.38);
  transform: rotate(45deg);
}

.hint-container.hint-visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}

@keyframes signupPromptRipple {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

@keyframes signupPromptGlow {
  0%, 100% {
    border-color: rgba(245, 158, 11, 0.5);
    box-shadow: 0 0 24px rgba(245, 158, 11, 0.2),
                0 0 48px rgba(245, 158, 11, 0.1),
                0 12px 40px rgba(0, 0, 0, 0.4);
  }
  50% {
    border-color: rgba(251, 191, 36, 0.75);
    box-shadow: 0 0 32px rgba(245, 158, 11, 0.35),
                0 0 64px rgba(245, 158, 11, 0.15),
                0 12px 40px rgba(0, 0, 0, 0.4);
  }
}

@keyframes signupPromptShimmer {
  0% { background-position: -100% 0; }
  100% { background-position: 200% 0; }
}

@keyframes signupPromptFadeIn {
  to {
    opacity: 1;
  }
}

@keyframes signupPromptCardIn {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(-8px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* Signup prompt popover – near profile/menu button, non-blocking */
.signup-prompt-popover {
  position: absolute;
  top: calc(100% + 10px);
  right: 20px;
  z-index: 200;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
}

.signup-prompt-popover.is-visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.signup-prompt-card {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: linear-gradient(145deg, rgba(35, 32, 28, 0.98) 0%, rgba(28, 25, 22, 0.98) 100%);
  border: 2px solid rgba(245, 158, 11, 0.5);
  border-radius: 12px;
  max-width: min(320px, calc(100vw - 40px));
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  overflow: visible;
}

.signup-prompt-card::after {
  content: '';
  position: absolute;
  top: -8px;
  right: 24px;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-bottom: 8px solid rgba(245, 158, 11, 0.5);
}

.signup-prompt-popover.is-visible .signup-prompt-card {
  animation: signupPromptCardIn 0.35s ease-out forwards,
             signupPromptGlow 2.5s ease-in-out 0.35s infinite,
             signupPromptRipple 3s ease-in-out 0.35s infinite;
}

.signup-prompt-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    105deg,
    transparent 0%,
    transparent 40%,
    rgba(251, 191, 36, 0.08) 50%,
    transparent 60%,
    transparent 100%
  );
  background-size: 200% 100%;
  animation: signupPromptShimmer 4s ease-in-out infinite;
  pointer-events: none;
}

.signup-prompt-text {
  font-size: clamp(0.95rem, 2.5vw, 1.08rem);
  color: rgba(255, 255, 255, 0.95);
  margin: 0;
  flex: 1;
  min-width: 0;
  position: relative;
  z-index: 1;
  line-height: 1.4;
}

.signup-prompt-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
}

.signup-prompt-btn {
  font-family: inherit;
  font-size: clamp(0.95rem, 2.2vw, 1rem);
  padding: 10px 20px;
  min-height: 44px;
  min-width: 44px;
  background: linear-gradient(180deg, rgb(251, 191, 36), rgb(245, 158, 11));
  color: rgb(25, 25, 25);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
}

.signup-prompt-btn:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 6px 24px rgba(245, 158, 11, 0.5);
  filter: brightness(1.1);
}

.signup-prompt-btn:active {
  transform: translateY(0) scale(1);
}

.signup-prompt-dismiss {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  line-height: 1;
  color: rgba(255, 255, 255, 0.5);
  background: transparent;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: color 0.2s ease, background 0.2s ease;
}

.signup-prompt-dismiss:hover {
  color: rgba(255, 255, 255, 0.95);
  background: rgba(255, 255, 255, 0.1);
}

@media (max-width: 599px) {
  .signup-prompt-popover {
    right: 12px;
    top: calc(100% + 8px);
  }

  .signup-prompt-card::after {
    right: 12px;
  }
}

@media (max-width: 480px) {
  .signup-prompt-card {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
    gap: 10px;
    padding: 12px 14px;
  }

  .signup-prompt-actions {
    justify-content: center;
  }

  .signup-prompt-text {
    min-width: 0;
  }
}

.guess-button:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(83, 141, 78, 0.45);
  filter: brightness(1.1);
}

.hint-button:hover {
  transform: translateY(-1px);
  border-color: rgba(255, 255, 255, 0.3);
  filter: brightness(1.2);
}

.guess-button:active,
.hint-button:active {
  transform: translateY(0);
}

.autocomplete-list {
  list-style: none;
  padding: 6px 0;
  margin: 6px 0 0;
  position: absolute;
  width: 100%;
  z-index: 10;
  background: rgba(32, 32, 32, 0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5),
              0 0 0 1px rgba(83, 141, 78, 0.08);
  max-height: 260px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
  animation: acDropIn 0.18s ease-out;
  transform-origin: top center;
}

@keyframes acDropIn {
  from {
    opacity: 0;
    transform: scaleY(0.6) translateY(-4px);
  }
  to {
    opacity: 1;
    transform: scaleY(1) translateY(0);
  }
}

.autocomplete-list::-webkit-scrollbar {
  width: 6px;
}

.autocomplete-list::-webkit-scrollbar-track {
  background: transparent;
}

.autocomplete-list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
}

.autocomplete-list li {
  border: none;
  background: transparent;
}

.autocomplete-list button {
  border: none;
  background: transparent;
  color: rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 11px 16px;
  font-size: 1.15rem;
  font-family: inherit;
  cursor: pointer;
  border-radius: 8px;
  margin: 0 6px;
  width: calc(100% - 12px);
  transition: background 0.15s ease, color 0.15s ease;
}

.autocomplete-list button:hover,
.autocomplete-list button:focus-visible,
.autocomplete-list button.ac-active {
  background: rgba(83, 141, 78, 0.2);
  color: #fff;
  outline: none;
}

.autocomplete-list button.ac-active {
  border-left: 3px solid rgb(83, 141, 78);
  padding-left: 13px;
}

.autocomplete-list button .ac-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.autocomplete-list button .ac-match {
  color: rgb(98, 165, 92);
  font-weight: 700;
}

.autocomplete-wrapper {
  display: inline-block;
  position: relative;
}

.input-clear-btn {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  min-width: 32px;
  min-height: 32px;
  display: none;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.4);
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  border-radius: 50%;
  transition: color 0.15s ease, background 0.15s ease;
  z-index: 2;
}

.input-clear-btn.visible {
  display: flex;
}

.input-clear-btn:hover {
  color: rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.1);
}

.input-clear-btn:active {
  transform: translateY(-50%) scale(0.9);
  transition-duration: 0.05s;
}

/*Display results*/
.correct-guess-container {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

.js-additional-info,
.js-share-button {
  display: flex;
}

a.additional-info,
.share-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: auto;
  line-height: normal;
  padding: 10px 18px;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.07);
  color: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  font-size: 0.95rem;
  font-family: inherit;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}

a.additional-info:hover,
.share-button:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-1px);
}

a.additional-info:active,
.share-button:active {
  transform: scale(0.95);
  transition-duration: 0.05s;
}

.guess-button:disabled {
  border-color: rgba(255, 255, 255, 0.25);
}

/*Popup*/
.popup {
  position: fixed;
  top: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(-120%);
  background: rgba(38, 38, 38, 0.95);
  color: #fff;
  padding: 16px 36px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(83, 141, 78, 0.15);
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
  z-index: 9999;
  pointer-events: none;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
              opacity 0.3s ease;
  opacity: 0;
}

.popup.popup-visible {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.popup.popup-exit {
  transform: translateX(-50%) translateY(-40%);
  opacity: 0;
  transition: transform 0.25s ease-in,
              opacity 0.25s ease-in;
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 999;
  color: white;
  font-size: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}
.overlay.show {
  opacity: 1;
  pointer-events: auto;
}

body.modal-open {
  overflow: hidden;
}

/*Display guesses section*/
.grid-container {
  margin-top: 55px;
  display: flex;
  justify-content: center;
}

.element-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-gap: 20px;
}

.element {
  position: relative;
  width: 250px;
  height: 250px;
  border: 2px solid rgb(97, 97, 97);
  border-radius: 15px;
  background-color: rgb(42, 42, 42);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: all 0.3s ease;
}

.element.guessed-element {
  overflow: hidden;
}

.element.guessed-element::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.35) 100%);
  pointer-events: none;
  z-index: 1;
}

.element.guessed-element:hover {
  transform: scale(1.025);
  box-shadow: rgba(255, 255, 255, 0.16) 0px 5px 18px 0px, rgba(255, 255, 255, 0.06) 0px 0px 0px 1px;
}

.name {
  font-size: 20px;
}

.atomic-number,
.family {
  position: absolute;
  color: rgba(255, 255, 255, 0.85);
  font-size: 20px;
}

.atomic-number {
  top: 5px;
  left: 5px;
}

.atomic-signal {
  display: inline-block;
}

.atomic-signal.signal-bounce {
  animation: signalBounce 0.5s ease-out;
}

@keyframes signalBounce {
  0% { transform: scale(1); }
  30% { transform: scale(1.5) translateY(-3px); }
  60% { transform: scale(0.9); }
  100% { transform: scale(1); }
}

.family {
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
}

.symbol {
  font-size: 80px;
}

.element-slot-number {
  font-size: 2rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.08);
  user-select: none;
}

.element:not(.guessed-element) {
  border-style: dashed;
  border-color: rgba(255, 255, 255, 0.12);
  background-color: rgba(42, 42, 42, 0.5);
}

.element:not(.guessed-element).next-slot {
  border-color: rgba(83, 141, 78, 0.45);
  animation: nextSlotPulse 2.4s ease-in-out infinite;
}

@keyframes nextSlotPulse {
  0%, 100% {
    border-color: rgba(83, 141, 78, 0.25);
    box-shadow: 0 0 0 0 rgba(83, 141, 78, 0);
  }
  50% {
    border-color: rgba(83, 141, 78, 0.55);
    box-shadow: 0 0 12px 2px rgba(83, 141, 78, 0.15);
  }
}

.element.shimmer {
  overflow: hidden;
  position: relative;
}

.element.shimmer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    110deg,
    transparent 25%,
    rgba(255, 255, 255, 0.04) 37%,
    rgba(255, 255, 255, 0.07) 50%,
    rgba(255, 255, 255, 0.04) 63%,
    transparent 75%
  );
  background-size: 300% 100%;
  animation: shimmerSlide 2s linear infinite;
}

@keyframes shimmerSlide {
  0% { background-position: 0% 0; }
  100% { background-position: 300% 0; }
}

.element.shimmer-done {
  animation: shimmerReveal 0.35s ease-out forwards;
}

.element.shimmer-done::after {
  display: none;
}

@keyframes shimmerReveal {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.element.card-flip {
  opacity: 0;
  transform: rotateX(90deg) scale(0.95);
  animation: cardFlip 0.65s ease-out forwards;
}

@keyframes cardFlip {
  0% {
    transform: rotateX(90deg) scale(0.95);
    opacity: 0;
  }
  50% {
    opacity: 1;
  }
  100% {
    transform: rotateX(0deg) scale(1);
    opacity: 1;
  }
}

.element.correct-card {
  border-color: rgb(83, 141, 78);
  animation: winGlow 2s ease-in-out infinite alternate;
}

.element.correct-card.card-flip {
  opacity: 0;
  transform: rotateX(90deg) scale(0.95);
  animation: cardFlip 0.65s ease-out forwards, winGlow 2s ease-in-out 0.65s infinite alternate;
}


@keyframes winGlow {
  from {
    box-shadow: 0 0 12px rgba(83, 141, 78, 0.4),
                0 0 24px rgba(83, 141, 78, 0.15);
  }
  to {
    box-shadow: 0 0 20px rgba(83, 141, 78, 0.6),
                0 0 40px rgba(83, 141, 78, 0.25);
  }
}

.green {
  color: rgb(83, 141, 78);
}

.family.family-flash {
  animation: familyFlash 0.8s ease-out 0.4s;
}

@keyframes familyFlash {
  0% {
    color: rgb(83, 141, 78);
    text-shadow: none;
  }
  30% {

/*Shake animation*/
.shake {
  animation: shake 0.5s ease-in-out;
}

@keyframes shake {
  0% { transform: translateX(0); }
  15% { transform: translateX(-6px); }
  30% { transform: translateX(5px); }
  45% { transform: translateX(-4px); }
  60% { transform: translateX(3px); }
  75% { transform: translateX(-2px); }
  100% { transform: translateX(0); }
}

.glow-red {
  animation: redGlowFade 0.6s ease-out forwards;
}

@keyframes redGlowFade {
  0% {
    border-color: #f87171;
    box-shadow: 0 0 12px rgba(248, 113, 113, 0.6),
                0 0 24px rgba(248, 113, 113, 0.2);
  }
  100% {
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: none;
  }
}

/* Modal popups (Statistics &amp; How to Play) */
.modal-card {
  background: linear-gradient(165deg, #2d2d2d 0%, #1f1f1f 100%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  padding: 28px 32px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  color: white;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
  animation: modalAppear 0.25s ease-out;
  margin: auto;
}

@keyframes modalAppear {
  from {
    opacity: 0;
    transform: scale(0.96) translateY(-8px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.modal-card.modal-closing {
  animation: modalExit 0.2s ease-in forwards;
}

@keyframes modalExit {
  to {
    opacity: 0;
    transform: scale(0.96) translateY(8px);
  }
}

.modal-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 24px 0;
  letter-spacing: 0.02em;
  color: #fff;
}

.modal-back-button {
  font-size: 1rem;
  padding: 12px 28px;
  background-color: rgb(83, 141, 78);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 24px;
  transition: background-color 0.2s ease, transform 0.1s ease;
  font-family: inherit;
}

.modal-back-button:hover {
  background-color: rgb(98, 165, 92);
}

.modal-back-button:active {
  transform: scale(0.95);
  transition-duration: 0.05s;
}

/* Statistics modal */
.stats-modal .stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stats-modal .stat-item {
  background: rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transform: translateY(10px);
  animation: statFadeIn 0.4s ease-out forwards;
}

.stats-modal .stat-item:nth-child(1) { animation-delay: 0.1s; }
.stats-modal .stat-item:nth-child(2) { animation-delay: 0.18s; }
.stats-modal .stat-item:nth-child(3) { animation-delay: 0.26s; }
.stats-modal .stat-item:nth-child(4) { animation-delay: 0.34s; }
.stats-modal .stat-item:nth-child(5) { animation-delay: 0.42s; }

@keyframes statFadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.stats-modal .stat-item-wide {
  grid-column: span 2;
}

.stats-modal .stat-value {
  font-size: 1.75rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
  opacity: 0;
  transform: scale(0.7);
  animation: statPop 0.4s ease-out forwards;
}

.stats-modal .stat-item:nth-child(1) .stat-value { animation-delay: 0.2s; }
.stats-modal .stat-item:nth-child(2) .stat-value { animation-delay: 0.28s; }
.stats-modal .stat-item:nth-child(3) .stat-value { animation-delay: 0.36s; }
.stats-modal .stat-item:nth-child(4) .stat-value { animation-delay: 0.44s; }
.stats-modal .stat-item:nth-child(5) .stat-value { animation-delay: 0.52s; }

.stats-modal .stat-value.stat-pop-reset {
  animation: none;
  transform: scale(0.7);
  opacity: 0.4;
}

.stats-modal .stat-value.stat-pop {
  opacity: 1;
  transform: scale(1);
  animation: statPopUpdate 0.35s ease-out;
}

@keyframes statPop {
  to { opacity: 1; transform: scale(1); }
}

@keyframes statPopUpdate {
  0% { transform: scale(0.7); opacity: 0.4; }
  60% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.stats-modal .stat-label {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.65);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stats-modal .guess-distribution {
  text-align: left;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.stats-modal .distribution-title {
  font-size: 0.9rem;
  font-weight: 600;
  margin: 0 0 12px 0;
  color: rgba(255, 255, 255, 0.9);
}

.stats-modal .bars-container {
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  justify-content: center;
  gap: 10px;
  min-height: 120px;
}

.stats-modal .bar-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  min-width: 0;
}

.stats-modal .bar-count {
  font-size: 0.8rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
  margin-bottom: 6px;
  min-height: 1.2em;
}

.stats-modal .bar-track {
  width: 100%;
  height: 100px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 6px 6px 0 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.stats-modal .bar-fill {
  width: 100%;
  min-height: 4px;
  background: linear-gradient(180deg, rgb(98, 165, 92), rgb(83, 141, 78));
  border-radius: 6px 6px 0 0;
  transform: scaleY(0);
  transform-origin: bottom;
  animation: barGrow 0.5s ease-out forwards;
}

@keyframes barGrow {
  to {
    transform: scaleY(1);
  }
}

.stats-modal .bar-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.8);
  margin-top: 6px;

/* How to Play modal */

@keyframes helpItemIn {

/* Fire icon flicker + ember sparks */
.stats-fire-btn {
  position: relative;
  overflow: visible; /* let sparks escape the button bounds */
}

.stats-fire-btn i {
  position: relative;
  z-index: 2;
  animation: fireIconFlicker 2.4s ease-in-out infinite;
  transform-origin: center bottom;
}

@keyframes fireIconFlicker {
  0%, 100% {
    transform: scale(1) rotate(0deg);
    filter: brightness(1);
  }
  20% {
    transform: scale(1.05) rotate(-2deg);
    filter: brightness(1.15);
  }
  45% {
    transform: scale(0.96) rotate(1deg);
    filter: brightness(0.95);
  }
  70% {
    transform: scale(1.04) rotate(-1deg);
    filter: brightness(1.1);
  }
}

/* Ember sparks: small glowing dots drifting upward off the icon */
.stats-fire-btn::before,
.stats-fire-btn::after {
  content: '';
  position: absolute;
  bottom: 55%;
  left: 50%;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgb(251, 146, 60);
  box-shadow: 0 0 4px 1px rgba(251, 146, 60, 0.8);
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}

.stats-fire-btn::before {
  animation: emberRise1 1.8s ease-out infinite;
  animation-delay: 0.2s;
}

.stats-fire-btn::after {
  animation: emberRise2 2.2s ease-out infinite;
  animation-delay: 1s;
}

@keyframes emberRise1 {
  0% {
    opacity: 0;
    transform: translate(-50%, 0) scale(0.6);
  }
  15% {
    opacity: 1;
  }
  80% {
    opacity: 0.4;
  }
  100% {
    opacity: 0;
    transform: translate(-140%, -34px) scale(0.3);
  }
}

@keyframes emberRise2 {
  0% {
    opacity: 0;
    transform: translate(-50%, 0) scale(0.5);
  }
  15% {
    opacity: 1;
  }
  80% {
    opacity: 0.4;
  }
  100% {
    opacity: 0;
    transform: translate(60%, -30px) scale(0.25);
  }
}

/* Extra spark using a span we can inject, OR simulate with a radial glow pulse instead */
.stats-fire-btn.is-active {
  animation: fireBtnGlow 1.8s ease-in-out infinite alternate;
}

.stats-fire-btn.is-active i {
  animation: fireIconFlicker 1.4s ease-in-out infinite;
}

@keyframes loadingDots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

  }
  50% {
    transform: translateY(50vh) translateX(-15px) scale(1.1);
  }
  90% {
    opacity: 1;
    transform: translateY(10vh) translateX(8px) scale(0.9);
  }
  100% {
    transform: translateY(-5vh) translateX(0) scale(0);

button {
  cursor: pointer;
}

.container {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: 60px;
}

/*Navbar*/
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  padding: 10px 20px;
  color: white;
  font-size: 48px;
  border-bottom: 2px solid transparent;
  border-image: linear-gradient(90deg, transparent, rgb(83, 141, 78), rgb(98, 165, 92), rgb(83, 141, 78), transparent) 1;
}

.nav-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
}

.nav-left, .nav-right {
  display: flex;
}

.nav-button {
  border: none;
  font-size: 24px;
  cursor: pointer;
  padding: none;
  background: none;
  margin: 0px 10px;
}

.nav-icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  padding: 0;
  margin: 0 6px;
  cursor: pointer;
  font-family: inherit;
}

.nav-icon-circle {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 0;
  background: rgba(255, 255, 255, 0.35);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  color: #fff;
  transition: background 0.2s, color 0.2s, transform 0.15s ease;
}

.nav-icon-circle::before {
  content: '';
  position: absolute;
  inset: 2px;
  background: rgb(25, 25, 25);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}

.nav-icon-circle > * {
  position: relative;
  z-index: 1;
}

.nav-icon-btn:hover .nav-icon-circle {
  background: rgb(83, 141, 78);
  color: rgb(98, 165, 92);
  transform: scale(1.08);
}

.nav-icon-btn:active .nav-icon-circle {
  transform: scale(0.92);
  transition-duration: 0.05s;
}

.nav-icon-circle svg {
  flex-shrink: 0;
}

.nav-profile-initial-wrap .nav-profile-initial {
  font-size: 1rem;
  font-weight: 700;
  color: rgb(98, 165, 92);
}

.nav-icon-btn:hover .nav-profile-initial-wrap .nav-profile-initial {
  color: #fff;
}

.nav-desktop-only {
  display: flex;
}

.nav-mobile-only {
  display: none;
}

@media (max-width: 599px) {
  .nav-desktop-only {
    display: none !important;
  }

  .nav-mobile-only {
    display: block;
  }

  .nav-mobile-menu {
    position: absolute;
    right: 12px;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .nav-mobile-menu .nav-icon-btn:hover .nav-icon-circle {
    transform: none;
  }

  .nav-dropdown {
    position: absolute;
    right: 0;
    top: calc(100% + 10px);
    min-width: 220px;
    padding: 8px 0;
    background: linear-gradient(165deg, #2d2d2d 0%, #1f1f1f 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    transform-origin: top right;
    animation: navDropdownOpen 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .nav-dropdown.nav-dropdown-closing {
    animation: navDropdownClose 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  .nav-dropdown-item {
    animation: navDropdownItemIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }

  .nav-dropdown-item:nth-child(1) { animation-delay: 0.04s; }
  .nav-dropdown-item:nth-child(2) { animation-delay: 0.07s; }
  .nav-dropdown-item:nth-child(3) { animation-delay: 0.1s; }
  .nav-dropdown-item:nth-child(4) { animation-delay: 0.13s; }

  .nav-dropdown:not([hidden]):not(.nav-dropdown-closing) .js-mobile-profile-avatar > * {
    animation: mobileProfileArrive .4s ease-out .13s backwards;
  }
  .nav-dropdown-profile-avatar {
    transition: transform .18s ease, color .18s ease, background .18s ease;
  }
  .js-profile-button:is(:hover, :focus-visible) .nav-dropdown-profile-avatar {
    color: rgb(98, 165, 92);
    background: rgb(83, 141, 78);
    transform: scale(1.08);
  }
  .js-profile-button:active .nav-dropdown-profile-avatar { transform: scale(.92); }


  .nav-dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 16px;
    border: none;
    background: none;
    color: #fff;
    font-family: inherit;
    font-size: 1.05rem;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s;
  }

  .nav-dropdown-item:hover,
  .nav-dropdown-item:focus-visible {
    background: rgba(83, 141, 78, 0.2);
    outline: none;
  }

  .nav-dropdown-item-icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 0;
    border: none;
    background: rgba(255, 255, 255, 0.25);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    color: #fff;
    flex-shrink: 0;
  }

  .nav-dropdown-item-icon::before {
    content: '';
    position: absolute;
    inset: 2px;
    background: #252525;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }

  .nav-dropdown-item-icon > * {
    position: relative;
    z-index: 1;
  }

  .nav-dropdown-profile-avatar {
    font-size: 14px;
  }

  .nav-dropdown .nav-profile-initial-wrap .nav-profile-initial {
    font-size: 0.85rem;
  }

  .navbar {
    font-size: 28px;
    padding: 12px 56px 12px 16px;
    min-height: 56px;
    box-sizing: border-box;
    align-items: center;
  }

  .nav-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 120px);
    pointer-events: none;
  }

  .nav-center .nav-text {
    pointer-events: auto;
  }
}

@keyframes navDropdownOpen {
  from {
    opacity: 0;
    transform: scale(0.92) translateY(-6px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes navDropdownClose {
  from {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  to {
    opacity: 0;
    transform: scale(0.88) translateY(-12px);
  }
}

@keyframes navDropdownItemIn {

    opacity: 0;

  }

    transform: translateX(0);
  }
}

.nav-text {

.nav-text:hover {

@keyframes titleFlicker {

.green-letter {

@keyframes nFlicker1 {

@keyframes nFlicker3 {
  0%, 100% { color: rgb(98, 165, 92); text-shadow: none; }

/*Guessing area*/
.guess-form {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  position: relative;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
}

.guess-row {
  display: flex;
  align-items: stretch;
  gap: 6px;
  width: 100%;
  max-width: 440px;
}

.guess-row .autocomplete-wrapper {
  flex: 1;
  min-width: 0;
}

.guess-row .guess-input {
  width: 100%;
}

.guess-row .guess-button {
  flex-shrink: 0;
}

.guess-input {
  font-size: 1.3rem;
  padding: 12px 32px 12px 14px;
  background-color: rgb(42, 42, 42);
  border: 2px solid rgba(255, 255, 255, 0.25);
  color: white;
  width: 300px;
  border-radius: 10px;
  font-family: inherit;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.guess-input:-webkit-autofill,
.guess-input:-webkit-autofill:hover,
.guess-input:-webkit-autofill:focus,
.guess-input:-webkit-autofill:active {
  -webkit-box-shadow: 0 0 0 1000px rgb(42, 42, 42) inset !important;
  box-shadow: 0 0 0 1000px rgb(42, 42, 42) inset !important;
  -webkit-text-fill-color: #fff !important;
  caret-color: #fff;
}

.guess-input:autofill {
  box-shadow: 0 0 0 1000px rgb(42, 42, 42) inset;
  color: #fff;
}

.guess-input:focus {
  outline: none;
  border-color: rgb(83, 141, 78);
  box-shadow: 0 0 0 3px rgba(83, 141, 78, 0.25);
}

.guess-input:disabled,
.guess-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  filter: grayscale(0.4);
}

.guess-button,
.hint-button {
  font-size: 1.05rem;
  font-family: inherit;
  font-weight: 600;
  padding: 12px 0;
  border: none;
  background: linear-gradient(180deg, rgb(98, 165, 92), rgb(70, 125, 66));
  color: white;
  width: 110px;
  border-radius: 10px;
  transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
  box-shadow: 0 2px 8px rgba(83, 141, 78, 0.3);
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

.hint-button {
  width: 46px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  flex-shrink: 0;
}

.hint-container {
  position: absolute;
  top: calc(100% + 12px);
  left: 0;
  right: 0;
  z-index: 8;
  padding: 13px 18px 14px;
  font-size: 1.05rem;
  color: rgba(255, 255, 255, 0.92);
  background: linear-gradient(145deg, rgba(48, 62, 48, 0.98), rgba(32, 40, 32, 0.98));
  border: 1px solid rgba(98, 165, 92, 0.38);
  border-radius: 12px;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(98, 165, 92, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-5px);
  text-align: center;
  line-height: 1.4;
}

.hint-container::before {
  content: '';
  position: absolute;
  top: -6px;
  right: 16px;
  width: 11px;
  height: 11px;
  background: rgba(48, 62, 48, 0.98);
  border-top: 1px solid rgba(98, 165, 92, 0.38);
  border-left: 1px solid rgba(98, 165, 92, 0.38);
  transform: rotate(45deg);
}

.hint-container.hint-visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}

@keyframes signupPromptRipple {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

@keyframes signupPromptGlow {
  0%, 100% {
    border-color: rgba(245, 158, 11, 0.5);
    box-shadow: 0 0 24px rgba(245, 158, 11, 0.2),
                0 0 48px rgba(245, 158, 11, 0.1),
                0 12px 40px rgba(0, 0, 0, 0.4);
  }
  50% {
    border-color: rgba(251, 191, 36, 0.75);
    box-shadow: 0 0 32px rgba(245, 158, 11, 0.35),
                0 0 64px rgba(245, 158, 11, 0.15),
                0 12px 40px rgba(0, 0, 0, 0.4);
  }
}

@keyframes signupPromptShimmer {
  0% { background-position: -100% 0; }
  100% { background-position: 200% 0; }
}

@keyframes signupPromptFadeIn {
  to {
    opacity: 1;
  }
}

@keyframes signupPromptCardIn {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(-8px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* Signup prompt popover – near profile/menu button, non-blocking */
.signup-prompt-popover {
  position: absolute;
  top: calc(100% + 10px);
  right: 20px;
  z-index: 200;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
}

.signup-prompt-popover.is-visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.signup-prompt-card {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: linear-gradient(145deg, rgba(35, 32, 28, 0.98) 0%, rgba(28, 25, 22, 0.98) 100%);
  border: 2px solid rgba(245, 158, 11, 0.5);
  border-radius: 12px;
  max-width: min(320px, calc(100vw - 40px));
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  overflow: visible;
}

.signup-prompt-card::after {
  content: '';
  position: absolute;
  top: -8px;
  right: 24px;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-bottom: 8px solid rgba(245, 158, 11, 0.5);
}

.signup-prompt-popover.is-visible .signup-prompt-card {
  animation: signupPromptCardIn 0.35s ease-out forwards,
             signupPromptGlow 2.5s ease-in-out 0.35s infinite,
             signupPromptRipple 3s ease-in-out 0.35s infinite;
}

.signup-prompt-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    105deg,
    transparent 0%,
    transparent 40%,
    rgba(251, 191, 36, 0.08) 50%,
    transparent 60%,
    transparent 100%
  );
  background-size: 200% 100%;
  animation: signupPromptShimmer 4s ease-in-out infinite;
  pointer-events: none;
}

.signup-prompt-text {
  font-size: clamp(0.95rem, 2.5vw, 1.08rem);
  color: rgba(255, 255, 255, 0.95);
  margin: 0;
  flex: 1;
  min-width: 0;
  position: relative;
  z-index: 1;
  line-height: 1.4;
}

.signup-prompt-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
}

.signup-prompt-btn {
  font-family: inherit;
  font-size: clamp(0.95rem, 2.2vw, 1rem);
  padding: 10px 20px;
  min-height: 44px;
  min-width: 44px;
  background: linear-gradient(180deg, rgb(251, 191, 36), rgb(245, 158, 11));
  color: rgb(25, 25, 25);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
}

.signup-prompt-btn:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 6px 24px rgba(245, 158, 11, 0.5);
  filter: brightness(1.1);
}

.signup-prompt-btn:active {
  transform: translateY(0) scale(1);
}

.signup-prompt-dismiss {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  line-height: 1;
  color: rgba(255, 255, 255, 0.5);
  background: transparent;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: color 0.2s ease, background 0.2s ease;
}

.signup-prompt-dismiss:hover {
  color: rgba(255, 255, 255, 0.95);
  background: rgba(255, 255, 255, 0.1);
}

@media (max-width: 599px) {
  .signup-prompt-popover {
    right: 12px;
    top: calc(100% + 8px);
  }

  .signup-prompt-card::after {
    right: 12px;
  }
}

@media (max-width: 480px) {
  .signup-prompt-card {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
    gap: 10px;

.guess-button:hover {
