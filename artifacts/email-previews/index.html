<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elementle email previews</title>
    <style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#eee;font:16px Arial}header{padding:24px;max-width:1000px;margin:auto}h1{font-size:24px;margin:0 0 12px}p{color:#bbb;line-height:1.5}select,button{padding:12px;border:1px solid #538d4e;border-radius:8px;background:#242824;color:white;margin:4px}iframe{display:block;width:100%;height:1100px;border:0;margin:auto;background:#191919;max-width:900px}button{cursor:pointer}</style>
    <header><h1>Elementle transactional emails</h1><p>13 samples rendered with the actual API templates. Signup, resend verification, and Google signup share the verification template. Preview dates and card details are examples. No valid account tokens are included.</p><select id="scenario" aria-label="Email scenario"><option value="monthly-trialing.html">Monthly Trialing</option><option value="monthly-active.html">Monthly Active</option><option value="monthly-trial-reminder.html">Monthly Trial Reminder</option><option value="yearly-trialing.html">Yearly Trialing</option><option value="yearly-active.html">Yearly Active</option><option value="yearly-trial-reminder.html">Yearly Trial Reminder</option><option value="canceled-at-period-end.html">Canceled At Period End</option><option value="canceled-immediately.html">Canceled Immediately</option><option value="payment-first-failure.html">Payment First Failure</option><option value="payment-second-failure.html">Payment Second Failure</option><option value="payment-grace-expired.html">Payment Grace Expired</option><option value="account-verification.html">Account Verification</option><option value="password-reset.html">Password Reset</option></select><button id="desktop">Desktop</button><button id="mobile">Mobile (375px)</button></header><iframe id="email" title="Email preview" src="monthly-trialing.html"></iframe><script>const frame=document.getElementById('email');document.getElementById('scenario').onchange=e=>frame.src=e.target.value;document.getElementById('desktop').onclick=()=>frame.style.maxWidth='900px';document.getElementById('mobile').onclick=()=>frame.style.maxWidth='375px';</script></html>
